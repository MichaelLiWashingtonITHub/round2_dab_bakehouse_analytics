    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://adb-7405613058915801.1.azuredatabricks.net
    variables:
      catalog: round2_catalog_dab_bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://adb-7405613058915801.1.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/michaelli@washingtonithub.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/michaelli@washingtonithub.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: round2_catalog_dab_bakehouse_analytics_prod
      schema: rnd
    permissions:
      - user_name: michaelli@washingtonithub.onmicrosoft.com
        level: CAN_MANAGE

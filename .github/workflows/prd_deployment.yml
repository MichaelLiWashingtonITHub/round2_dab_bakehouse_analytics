name: 'production deployment'
concurrency: 1

# Trigger this workflow wheneber a pull request is pushed to the repos's
# main branch

on: 
  push:
    branches:
      - main
    paths:
      - 'bundle_round2_bakehouse_analytics/**'
jobs:
  deploy:
    name: 'Deploy bundles'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy
        working-directory: bundle_round2_bakehouse_analytics
        env:
          DATABRICKS_TOKEN: ${{secrets.SP_TOKEN}}
          DATABRICKS_BUNDLE_ENV: prod
      
